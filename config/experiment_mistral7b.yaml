# Mistral-7B REPLICATION of the v2 prompt-length-control study.
#
# PURPOSE: test whether the responsibility-specialization effects observed on qwen2.5:7b and
# llama3.1:8b replicate on a THIRD model family. This is NOT a new design.
#
# EVERYTHING here is a byte-for-byte copy of config/experiment_llama31_8b.yaml EXCEPT:
#   (1) model:              llama3.1:8b          -> mistral:7b        (the ONLY substantive change)
#   (2) experiment_version: v2_llama31_8b        -> v2_mistral_7b
#   (3) out_dir/pilot_dir:  results/v2/llama31_8b[...] -> results/v2/mistral_7b[...]
#   (4) pilot spec:         3 tasks x 1 run       -> 5 tasks x 2 runs = 30 (per task brief)
# Same 50 tasks, same prompts, same padding, same tools, same topology, same handoffs, same
# temperature, same seeds, same num_ctx/num_predict/top_p, same timeout, same interleave +
# execution_seed. The frozen condition-C padding is NOT re-sized for Mistral (that would change
# the prompts); the actual per-agent token budgets under the Mistral tokenizer are MEASURED and
# reported at validation time instead.

experiment_version: "v2_mistral_7b"

model: "mistral:7b"           # <-- THE ONLY substantive change vs experiment_llama31_8b.yaml
temperature: 0.7              # held constant
num_ctx: 16384               # held constant with the Qwen/Llama v2 runs
num_predict: 1024             # held constant
top_p: 0.9                   # held constant
seed_base: null

agent_count: 3               # held constant
control_flow: "strict_linear"
max_tool_iters: 4            # held constant

runs_per_task: 5             # held constant -> 50 x 5 x 3 = 750 runs
seeds: [11, 22, 33, 44, 55]   # held constant (per-run seed stays tied to run_index)

ollama_url: "http://localhost:11434/api/chat"
request_timeout_s: 1800       # held constant with the Qwen/Llama v2 runs

tasks_path: "data/tasks_v2.jsonl"   # SAME 50 tasks, same IDs, same wording, same order
out_dir: "results/v2/mistral_7b"            # NEW: never collides with Qwen or Llama outputs
pilot_dir: "results/v2/mistral_7b_pilot"    # NEW

conditions: ["generalist", "specialized", "specialized_length_matched"]

# ---- execution-order randomization (identical to the Llama replication) ----
# interleave=true shuffles the full (condition x task x run) job list with execution_seed so
# A/B/C are interleaved instead of run in blocks. This changes ONLY the order in which jobs
# execute; task assignment, condition, run_index and per-run seed are unchanged.
interleave: true
execution_seed: 20261007

# Pilot: 5 tasks spanning all 3 sources (MuSiQue, HotpotQA, hand-authored) x 2 runs x 3 conditions = 30 runs
pilot_runs_per_task: 2
pilot_task_ids: ["MQ01", "MQ02", "HP01", "HP02", "HA01"]
