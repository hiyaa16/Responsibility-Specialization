# Track B — depth x complexity x condition. See preregistration_trackB.md.
experiment_version: trackB

tasks_path: data/tasks_trackB.jsonl
out_dir: results/trackB
pilot_dir: results/trackB_pilot

model: qwen2.5:7b
ollama_url: http://localhost:11434/api/chat
temperature: 0.7
top_p: 0.9
num_ctx: 16384
num_predict: 1024
max_tool_iters: 4
request_timeout_s: 1800

conditions:
  - generalist
  - specialized_length_matched

depths: [3, 7]          # primary contrast (extremes); add 5 for a dose-response curve
model_tag:                # (blank) = Qwen default; uses the already-frozen un-tagged padding + existing 480 runs
runs_per_task: 3          # 480 runs/model, kept equal across Qwen/Llama/Mistral for a clean cross-model comparison
seeds: [11, 22, 33, 44, 55]

# interleaved execution so latency is de-confoundable (the v2 Qwen gap). Fixed for reproducibility.
schedule_seed: 20261022

# pilot: a few tasks per level, 1 rep, both depths -> validate harness + generalist-degradation
pilot_task_ids: [TB-K2-00, TB-K2-01, TB-K2-02, TB-K4-00, TB-K4-01, TB-K4-02]
pilot_runs_per_task: 1
